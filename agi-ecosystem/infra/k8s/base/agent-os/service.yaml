apiVersion: v1
kind: Service
metadata:
  name: agent-os-runtime
  namespace: agi-ecosystem
  labels:
    app: agent-os-runtime
spec:
  selector:
    app: agent-os-runtime
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
  type: ClusterIP
