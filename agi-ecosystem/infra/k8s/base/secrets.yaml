apiVersion: v1
kind: Secret
metadata:
  name: agi-secrets
  namespace: agi-ecosystem
type: Opaque
stringData:
  # Database credentials (use external secret manager in production)
  POSTGRES_URL: "postgresql://agi_user:${POSTGRES_PASSWORD}@postgres:5432/agi_events"
  KAFKA_BROKERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379"

  # Encryption keys (rotate via Vault/SealedSecrets)
  EVENT_STORE_ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
  MYTHOS_SIGNING_KEY: "${MYTHOS_KEY}"
