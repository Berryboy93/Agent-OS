apiVersion: v1
kind: Service
metadata:
  name: mythos-policy-engine
  namespace: agi-ecosystem
  labels:
    app: mythos-policy-engine
spec:
  selector:
    app: mythos-policy-engine
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
  type: ClusterIP
