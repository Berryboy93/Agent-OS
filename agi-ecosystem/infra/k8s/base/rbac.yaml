apiVersion: v1
kind: ServiceAccount
metadata:
  name: agi-runtime
  namespace: agi-ecosystem
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agi-runtime-role
  namespace: agi-ecosystem
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agi-runtime-binding
  namespace: agi-ecosystem
subjects:
- kind: ServiceAccount
  name: agi-runtime
  namespace: agi-ecosystem
roleRef:
  kind: Role
  name: agi-runtime-role
  apiGroup: rbac.authorization.k8s.io
