name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile      - name: Ensure test env file exists
        run: test -f packages/event-store/.env.test.example && cp packages/event-store/.env.test.example packages/event-store/.env.test.local || touch packages/event-store/.env.test.local
      - name: Run tests
        run: pnpm test

      - name: Run coverage
        run: pnpm test:coverage
